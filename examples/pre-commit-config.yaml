# Save this as .pre-commit-config.yaml in your project root.
repos:
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.14.0
    hooks:
      - id: panache-lint
      - id: panache-format

# To apply safe lint fixes before formatting, add args: [--fix] to panache-lint.
# For a formatting check that leaves files unchanged, add args: [--check] to
# panache-format. Both hooks accept args: [--config, custom-config.toml].
